<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Sign In - Sheraton Hotels Clone</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >

    <link
        rel="stylesheet"
        href="css/signin.css"
    >

</head>

<body>

    <!-- NAVBAR -->

    <nav class="navbar">

        <div class="logo">
            Sheraton Hotels
        </div>

        <div class="nav-links">

            <a href="index.html">
                Home
            </a>

            <a href="hotels.html">
                Stays
            </a>

            <a href="bookings.html">
                Bookings
            </a>

            <a href="signin.html" class="active">
                Sign In
            </a>

        </div>

    </nav>


    <!-- SIGN IN SECTION -->

    <main class="signin-container">

        <div class="signin-card">

            <h1>Sign In</h1>

            <p class="signin-subtitle">
                Sign in to manage your hotel bookings.
            </p>


            <form id="signinForm">

                <div class="form-group">

                    <label for="name">
                        Full Name
                    </label>

                    <input
                        type="text"
                        id="name"
                        placeholder="Enter your name"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="email">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="Enter your email"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        placeholder="Enter your password"
                        required
                        minlength="6"
                    >

                </div>


                <button
                    type="submit"
                    class="signin-button"
                >
                    Sign In
                </button>

            </form>


            <p
                id="signinMessage"
                class="signin-message"
            ></p>

        </div>

    </main>


    <script src="js/signin.js"></script>

</body>

</html>
